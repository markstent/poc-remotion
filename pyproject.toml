[project]
name = "poc-remotion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "onnxruntime>=1.31.0",
    "pydantic>=2.14.1",
]

[project.scripts]
poc-remotion = "poc_remotion.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
